name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o mtucheck-${{ matrix.goos }} .
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: 0
      - uses: actions/upload-artifact@v4
        with:
          name: mtucheck-${{ matrix.goos }}
          path: mtucheck-${{ matrix.goos }}
